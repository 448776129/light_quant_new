<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} — 量化系统</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
/* 服务端渲染补充样式（旧系统 CSS 面向 JS 渲染，这里补少量适配） */
.nav-item a{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:inherit;text-decoration:none}
.nav.expanded .nav-item a{justify-content:flex-start}
.panel{display:block}
.page{padding:0 2px}
.page-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.page-h h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px}
.form-row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.form-row label{font-size:12px;font-weight:600;min-width:110px;color:var(--text-2)}
.form-row input,.form-row select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card-2);color:var(--text);font-size:13px;font-family:inherit}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--cyan)}
.stat{display:inline-block;background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:10px 20px;margin-right:10px;margin-bottom:8px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--cyan);font-family:var(--num);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--text-3)}
pre.result{background:var(--card-2);border:1px solid var(--border);padding:10px;border-radius:8px;font-size:12px;max-height:220px;overflow:auto;color:var(--text-2)}
.btn{padding:7px 16px;border:none;border-radius:8px;background:var(--grad);color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{opacity:.9}
.btn.ghost{background:var(--card-2);color:var(--text-2);border:1px solid var(--border)}
.ok{color:var(--green)} .err{color:var(--red)}
.muted{color:var(--text-3);font-size:12px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;background:var(--cyan-dim);color:var(--cyan);margin-right:6px}
</style>
</head>
<body>
<div class="app">

<!-- ===== Left Icon Nav（服务端渲染，链接导航）===== -->
<nav class="nav" id="appNav">
  <div class="nav-logo">LQ</div>
  {% for item in nav %}
  <div class="nav-item {{ 'on' if item.key == active else '' }}" title="{{ item.label }}">
    <a href="{{ item.href }}">{{ item.icon|safe }}<span class="nav-label">{{ item.label }}</span></a>
  </div>
  {% endfor %}
  <div class="nav-spacer"></div>
  <div class="nav-item" title="切换主题" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    <span class="nav-label">切换主题</span>
  </div>
  <div class="nav-item nav-collapse" onclick="toggleNavCollapse()" title="展开/收起">
    <svg id="navCollapseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18l6-6-6-6"/></svg>
    <span class="nav-label">展开菜单</span>
  </div>
</nav>

<!-- ===== Main Area ===== -->
<div class="main">

<!-- ===== Top Bar ===== -->
<header class="topbar">
  <div class="title">量化系统 <span>Console</span></div>
  <div class="topbar-c">
    <div class="st"><span class="dot ok"></span><span>服务在线</span></div>
  </div>
  <div class="topbar-r">
    <span class="quota">DB <b>{{ db_rows }}</b> 行</span>
    <span class="session">{{ session_label }}</span>
  </div>
</header>

<!-- ===== Content ===== -->
<div class="content">
  <section class="panel active">
    {% block content %}{% endblock %}
  </section>
</div>

</div>
</div>

<script>
// 主题切换（沿用旧系统变量方案）
function toggleTheme(){
  const b = document.documentElement;
  const cur = b.getAttribute('data-theme');
  b.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  try{ localStorage.setItem('lqn-theme', b.getAttribute('data-theme')); }catch(e){}
}
function toggleNavCollapse(){
  const n = document.getElementById('appNav');
  n.classList.toggle('expanded');
}
(function(){
  try{ const t = localStorage.getItem('lqn-theme'); if (t) document.documentElement.setAttribute('data-theme', t); }catch(e){}
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
